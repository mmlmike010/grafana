# Fieldsphere fork: builds the `grafana` server binary per OS/arch on standard GitHub-hosted runners
# and uploads it as an artifact (consumed by desktop packaging). See contribute/fieldsphere-fork-ci.md.
# Upstream's version (Grafana org runners) is kept in .github/workflows-upstream-archive/build-go-matrix.yml.
name: Build Go (matrix)

on:
  # Every PR triggers the workflow so the "All steps completed" check always reports;
  # the heavy jobs are skipped by the `changes` job when no Go-relevant files changed.
  pull_request:
  push:
    branches:
      - main
      - release-*.*.*
      - cursor/build-go-matrix-broken-test-f3d3
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions: {}

jobs:
  changes:
    name: Detect Go changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            go:
              - 'pkg/**'
              - 'apps/**'
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - 'go.work'
              - 'go.work.sum'
              - 'cue.mod/**'
              - 'Makefile'
              - 'desktop/**'
              - '.github/workflows/build-go-matrix.yml'

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: changes
    if: needs.changes.outputs.go == 'true'
    # pkg/util/sqlite uses modernc.org/sqlite (pure Go), so every target cross-compiles with CGO disabled.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, exe: grafana }
          - { goos: linux, goarch: arm64, exe: grafana }
          - { goos: darwin, goarch: amd64, exe: grafana }
          - { goos: darwin, goarch: arm64, exe: grafana }
          - { goos: windows, goarch: amd64, exe: grafana.exe }
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      BUILD_NUMBER: ${{ github.run_number }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve Go cache paths
        id: go-env
        run: |
          echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "buildcache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      # Caches are saved only from pushes to main (below) so PRs reuse them without each PR
      # adding several GB of per-target build cache and evicting main's entries.
      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-env.outputs.modcache }}
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: gomod-${{ runner.os }}-
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-env.outputs.buildcache }}
          key: gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-
      - name: Build grafana (${{ matrix.goos }}/${{ matrix.goarch }})
        run: make build-go
      - name: Stage binary
        run: |
          mkdir -p dist
          cp "bin/${GOOS}/${GOARCH}/grafana" "dist/${{ matrix.exe }}"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grafana-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.exe }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - name: Save Go module cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-env.outputs.modcache }}
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
      - name: Save Go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-env.outputs.buildcache }}
          key: gobuild-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}

  smoke:
    name: Smoke ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [changes, build]
    # Still smoke the targets that built when another target failed to compile.
    if: ${{ !cancelled() && needs.changes.outputs.go == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, exe: grafana, runner: ubuntu-24.04 }
          - { goos: linux, goarch: arm64, exe: grafana, runner: ubuntu-24.04-arm }
          - { goos: darwin, goarch: amd64, exe: grafana, runner: macos-15-intel }
          - { goos: darwin, goarch: arm64, exe: grafana, runner: macos-15 }
          - { goos: windows, goarch: amd64, exe: grafana.exe, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grafana-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin
      - name: grafana server -v
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Artifact zips do not preserve the executable bit.
          chmod +x "bin/${{ matrix.exe }}"
          echo "host: $(uname -s) $(uname -m)"
          "./bin/${{ matrix.exe }}" --version
          out="$("./bin/${{ matrix.exe }}" server -v)"
          echo "$out"
          grep -q "^Version .*(commit: ${EXPECTED_COMMIT}," <<< "$out"

  required-build-go-matrix:
    name: All steps completed
    needs: [changes, build, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "One or more Build Go (matrix) jobs failed"
            exit 1
          fi
          echo "All steps completed successfully"
