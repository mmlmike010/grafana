# Fieldsphere fork: upstream Build Go (matrix) used Grafana org runners (ubuntu-x64-large-io).
# The real workflow lives in .github/workflows-upstream-archive/build-go-matrix.yml.
# This stub keeps the same workflow name for branch protection and always succeeds so
# missing org runners do not fail every PR and spam Cursor GitHub CI Auto-Fix.
name: Build Go (matrix)

on:
  pull_request:
  push:
    branches:
      - main
      - release-*.*.*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions: {}

jobs:
  required-build-go-matrix:
    name: All steps completed
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Build Go (matrix) is a no-op on this fork; see contribute/fieldsphere-fork-ci.md'
